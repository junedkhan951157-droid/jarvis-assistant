<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS</title><style>body{margin:0;min-height:100vh;background:#02070b;color:#00eaff;font-family:Arial;text-align:center;display:flex;align-items:center;justify-content:center}.box{width:92%;max-width:700px}.orb{width:150px;height:150px;margin:auto;border:3px solid #00eaff;border-radius:50%;box-shadow:0 0 30px #00eaff,inset 0 0 25px #00eaff;animation:p 2s infinite}.listen{animation:p .7s infinite}h1{letter-spacing:8px;font-size:50px}button{padding:14px 24px;margin:8px;border:2px solid #00eaff;border-radius:30px;background:transparent;color:#00eaff;font-size:17px}.panel{margin-top:20px;border:1px solid #075c6d;border-radius:15px;padding:15px;text-align:left}.label{opacity:.6;font-size:12px;margin-top:10px}.value{font-size:18px;margin-top:5px}@keyframes p{50%{transform:scale(1.08);box-shadow:0 0 55px #00eaff,inset 0 0 35px #00eaff}}</style></head><body><div class="box"><div id="orb" class="orb"></div><h1>J.A.R.V.I.S</h1><div id="status">SYSTEM READY</div><button id="go">🎙️ ACTIVATE</button><button id="stop">⏹ STOP</button><div class="panel"><div class="label">YOU SAID</div><div id="heard" class="value">Awaiting command...</div><div class="label">JARVIS</div><div id="reply" class="value">Ready.</div></div></div><script>
const R=window.SpeechRecognition||window.webkitSpeechRecognition,go=document.getElementById("go"),stop=document.getElementById("stop"),st=document.getElementById("status"),h=document.getElementById("heard"),r=document.getElementById("reply"),o=document.getElementById("orb");let rec;
function say(x){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(x);u.lang="en-IN";speechSynthesis.speak(u)}function ans(x){r.textContent=x;say(x)}function open(x,m){ans(m);setTimeout(()=>location.href=x,600)}
function calc(q){let s=q.toLowerCase().replace(/what is|what's|calculate|calc|please|can you|tell me|find|solve|the answer to|answer|equals|equal to|result of|how much is/g," ").replace(/multiplied by|multiply by|times| x /g," * ").replace(/divided by|divide by|over/g," / ").replace(/plus|add|added to|and/g," + ").replace(/minus|subtract|subtracted from|take away|less/g," - ").replace(/[^0-9+\-*/().\s]/g," ").replace(/\s+/g," ").trim();if(!/[+\-*/]/.test(s))return null;try{if(!/^[0-9+\-*/().\s]+$/.test(s))return null;let v=Function('"use strict";return ('+s+')')();return Number.isFinite(v)?Math.round((v+Number.EPSILON)*1e8)/1e8:null}catch(e){return null}}
function command(q){let t=q.toLowerCase();
if(/\b(hello|hi|hey|hii|namaste)\b/.test(t))return ans("Hello. How can I help you?");
if((t.includes("who")&&t.includes("you"))||t.includes("your name"))return ans("I am Jarvis, your voice assistant.");
if(/\b(time|samay|kitne baje)\b/.test(t))return ans("The time is "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}));
if(/\b(date|today|aaj|tarikh)\b/.test(t))return ans("Today is "+new Date().toLocaleDateString("en-IN",{day:"numeric",month:"long",year:"numeric"}));
if(t.includes("youtube")&&/open|launch|start|khol|खोल/.test(t)&&!/search|find|dhund|ढूंढ/.test(t))return open("https://www.youtube.com/","Opening YouTube.");
if(t.includes("google")&&/open|launch|start|khol|खोल/.test(t)&&!/search|find|dhund|ढूंढ/.test(t))return open("https://www.google.com/","Opening Google.");
if(t.includes("youtube")&&/search|find|look for|dhund|ढूंढ|खोज/.test(t)){let x=q.replace(/search|find|look for|on youtube|in youtube|youtube|youtube par|par youtube|pe youtube|youtube pe|dhundho|dhund|ढूंढो|ढूंढ|खोजो|खोज/gi," ").replace(/\s+/g," ").trim();if(x)return open("https://www.youtube.com/results?search_query="+encodeURIComponent(x),"Searching YouTube for "+x)}
if((/search|find|look for|google/.test(t))&&!t.includes("youtube")){let x=q.replace(/search|find|look for|on google|in google|google|google par|par google|google pe|pe google/gi," ").replace(/\s+/g," ").trim();if(x)return open("https://www.google.com/search?q="+encodeURIComponent(x),"Searching Google for "+x)}
if(/\d/.test(t)&&/calculate|calc|plus|minus|times|multiply|divided|divide|add|subtract|what is|what's|how much|kitna|jod|जोड़|ghata|घटा|guna|गुणा|bhag|भाग/.test(t)){let v=calc(q);if(v!==null)return ans("The answer is "+v)}
if(/goodbye|bye|stop|band|बंद/.test(t))return ans("Goodbye.");
ans("I heard you say: "+q+". I don't know that command yet.")}
if(!R){st.textContent="VOICE NOT SUPPORTED";r.textContent="Use Chrome and allow microphone access."}else{rec=new R();rec.lang="en-IN";rec.interimResults=false;rec.continuous=false;rec.onstart=()=>{st.textContent="LISTENING...";o.classList.add("listen")};rec.onresult=e=>{h.textContent=e.results[0][0].transcript;command(h.textContent)};rec.onerror=e=>{st.textContent="MICROPHONE ERROR";r.textContent="Could not hear you. Try again."};rec.onend=()=>{st.textContent="SYSTEM READY";o.classList.remove("listen")}}
go.onclick=()=>{if(rec)try{h.textContent="Listening...";rec.start()}catch(e){}};stop.onclick=()=>{if(rec)rec.stop();speechSynthesis.cancel();st.textContent="SYSTEM READY";o.classList.remove("listen")};
</script></body></html>
