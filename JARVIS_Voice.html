<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JARVIS Voice Assistant</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#02070b;color:#00eaff;font-family:Arial,sans-serif;
display:flex;justify-content:center;align-items:center;text-align:center}
.box{width:92%;max-width:720px}
.orb{width:155px;height:155px;margin:auto;border:3px solid #00eaff;border-radius:50%;
box-shadow:0 0 25px #00eaff,inset 0 0 25px #00eaff;animation:pulse 2s infinite}
.listening{animation:pulse .7s infinite}
h1{font-size:clamp(35px,10vw,60px);letter-spacing:8px;margin:25px 0 10px}
#status{letter-spacing:3px;opacity:.85}
button{padding:15px 26px;margin:10px 5px;border:2px solid #00eaff;border-radius:30px;
background:transparent;color:#00eaff;font-size:17px}
button:active{background:#00eaff;color:#001015}
.panel{margin-top:25px;border:1px solid #075c6d;border-radius:15px;padding:18px;text-align:left}
.label{opacity:.6;font-size:12px;letter-spacing:2px;margin-top:10px}
.value{font-size:18px;margin-top:5px;min-height:25px}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 55px #00eaff,inset 0 0 35px #00eaff}}
</style>
</head>
<body>
<div class="box">
<div id="orb" class="orb"></div>
<h1>J.A.R.V.I.S</h1>
<div id="status">SYSTEM READY</div>
<button id="activate">🎙️ ACTIVATE</button>
<button id="stop">⏹ STOP</button>
<div class="panel">
<div class="label">YOU SAID</div><div id="heard" class="value">Awaiting command...</div>
<div class="label">JARVIS</div><div id="reply" class="value">Ready.</div>
</div>
</div>

<script>
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const activate = document.getElementById("activate");
const stop = document.getElementById("stop");
const status = document.getElementById("status");
const heard = document.getElementById("heard");
const reply = document.getElementById("reply");
const orb = document.getElementById("orb");

let recognition;

function speak(text){
  if("speechSynthesis" in window){
    speechSynthesis.cancel();
    speechSynthesis.speak(new SpeechSynthesisUtterance(text));
  }
}

function answer(text){
  reply.textContent = text;
  speak(text);
}

function runCommand(text){
  text = text.toLowerCase().trim();

  if(text.includes("hello") || text.includes("hi")){
    answer("Hello. How can I help you?");
  } else if(text.includes("time")){
    const now = new Date();
    answer("The time is " + now.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}));
  } else if(text.includes("who are you") || text.includes("your name")){
    answer("I am Jarvis, your voice assistant.");
  } else if(text.includes("open google")){
    answer("Opening Google.");
    setTimeout(()=>location.href="https://www.google.com",700);
  } else if(text.includes("stop") || text.includes("goodbye")){
    answer("Goodbye.");
  } else {
    answer("I heard you say: " + text + ". I do not know that command yet.");
  }
}

if(!SpeechRecognition){
  status.textContent="VOICE NOT SUPPORTED";
  reply.textContent="Try Chrome on Android and allow microphone permission.";
}else{
  recognition = new SpeechRecognition();
  recognition.lang = "en-IN";
  recognition.interimResults = false;
  recognition.continuous = false;

  recognition.onstart = ()=>{
    status.textContent="LISTENING...";
    orb.classList.add("listening");
  };

  recognition.onresult = (event)=>{
    const text = event.results[0][0].transcript;
    heard.textContent = text;
    runCommand(text);
  };

  recognition.onerror = (event)=>{
    status.textContent="MICROPHONE ERROR";
    reply.textContent = event.error === "not-allowed"
      ? "Microphone permission was denied. Allow microphone access in Chrome."
      : "Could not hear you. Please try again.";
  };

  recognition.onend = ()=>{
    status.textContent="SYSTEM READY";
    orb.classList.remove("listening");
  };
}

activate.onclick = ()=>{
  if(!recognition) return;
  heard.textContent="Listening...";
  recognition.start();
};

stop.onclick = ()=>{
  if(recognition) recognition.stop();
  speechSynthesis.cancel();
  status.textContent="SYSTEM READY";
  orb.classList.remove("listening");
};
</script>
</body>
</html>
